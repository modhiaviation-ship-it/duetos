# Builds the DuetOS ISO on GitHub's servers and offers it for download.
# Run it from the repository's "Actions" tab -> "Build DuetOS ISO" -> "Run workflow".
# When it finishes (~30-45 min), download "duetos-iso" from the run's Artifacts section.
name: Build DuetOS ISO

on:
  workflow_dispatch:
  push:
    paths:
      - 'iso/**'
      - 'discover.sh'
      - '.github/workflows/build-iso.yml'

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4

      - name: Free disk space (archiso needs ~10 GB)
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /opt/hostedtoolcache/CodeQL
          sudo docker image prune -af
          df -h /

      - name: Build ISO in an Arch Linux container
        run: |
          docker run --rm --privileged \
            -v "$GITHUB_WORKSPACE:/src" \
            archlinux:latest \
            bash -c 'pacman-key --init && pacman-key --populate archlinux && bash /src/iso/build-iso.sh'
          ls -lh out/

      - name: Upload ISO
        uses: actions/upload-artifact@v4
        with:
          name: duetos-iso
          path: |
            out/*.iso
            out/*.sha256
          compression-level: 0
          retention-days: 14
