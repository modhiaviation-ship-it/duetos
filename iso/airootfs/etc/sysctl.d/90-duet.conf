# DuetOS memory and power tuning (4 GB RAM, zram swap, eMMC)

# zram is far faster than the eMMC, so swapping to it early beats dropping file cache.
vm.swappiness = 180
# Read one page at a time from zram; readahead only helps on real disks.
vm.page-cluster = 0
# Don't over-reclaim after fragmentation events (recommended with zram).
vm.watermark_boost_factor = 0
vm.watermark_scale_factor = 125
# Write dirty pages every 15 s instead of 5 s: fewer wakeups and fewer eMMC writes.
vm.dirty_writeback_centisecs = 1500
# The NMI watchdog fires a periodic interrupt that blocks deep idle.
kernel.nmi_watchdog = 0
