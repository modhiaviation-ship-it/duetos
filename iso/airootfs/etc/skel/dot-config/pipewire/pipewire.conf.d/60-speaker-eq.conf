# Lightweight "Dolby replacement" for the 1 W tablet speakers.
# Adds a "Speakers (DuetOS EQ)" output: pick it in the sound panel for the built-in speakers.
# Cuts the bass the speakers can't reproduce (less distortion, louder perceived),
# lifts presence and air. Costs ~1% CPU, no extra daemon (EasyEffects would be ~80 MB).
context.modules = [
  { name = libpipewire-module-filter-chain
    args = {
      node.description = "Speakers (DuetOS EQ)"
      media.name       = "Speakers (DuetOS EQ)"
      filter.graph = {
        nodes = [
          { type = builtin name = hp  label = bq_highpass  control = { "Freq" = 170.0 "Q" = 0.7 } }
          { type = builtin name = lo  label = bq_peaking   control = { "Freq" = 300.0 "Q" = 1.0 "Gain" = 3.0 } }
          { type = builtin name = mid label = bq_peaking   control = { "Freq" = 900.0 "Q" = 1.2 "Gain" = -2.0 } }
          { type = builtin name = pre label = bq_peaking   control = { "Freq" = 3500.0 "Q" = 1.0 "Gain" = 2.5 } }
          { type = builtin name = air label = bq_highshelf control = { "Freq" = 9000.0 "Q" = 0.7 "Gain" = 2.0 } }
        ]
        links = [
          { output = "hp:Out"  input = "lo:In" }
          { output = "lo:Out"  input = "mid:In" }
          { output = "mid:Out" input = "pre:In" }
          { output = "pre:Out" input = "air:In" }
        ]
      }
      audio.channels = 2
      audio.position = [ FL FR ]
      capture.props = { node.name = "duet_eq_input" media.class = Audio/Sink }
      playback.props = { node.name = "duet_eq_output" node.passive = true }
    }
  }
]
