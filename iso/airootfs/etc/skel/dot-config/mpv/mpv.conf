# Hardware decode through VA-API (H.264 / HEVC / VP9 on UHD 600).
hwdec=vaapi
vo=gpu
profile=fast
# Never pick AV1 from YouTube (no hardware decoder on Gemini Lake), cap at 1080p.
ytdl-format=bestvideo[height<=?1080][vcodec!^=av01]+bestaudio/best
# Bigger on-screen controls for touch.
osc=yes
script-opts=osc-scalewindowed=1.6,osc-scalefullscreen=1.6
