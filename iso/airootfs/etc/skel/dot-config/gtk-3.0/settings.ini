[Settings]
# Windows 11 look: Fluent (light) theme + Fluent icons; falls back to Adwaita if missing.
gtk-theme-name=Fluent-Light
gtk-application-prefer-dark-theme=0
gtk-icon-theme-name=Fluent
gtk-cursor-theme-name=Fluent-cursors
gtk-cursor-theme-size=24
gtk-font-name=Noto Sans 10
# Windows button order on apps that draw their own titlebar.
gtk-decoration-layout=icon:minimize,maximize,close
# No animations.
gtk-enable-animations=0
gtk-xft-antialias=1
gtk-xft-hinting=1
gtk-xft-hintstyle=hintslight
gtk-xft-rgba=rgb
