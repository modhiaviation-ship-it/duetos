# Windows 11 light style (used for quick settings and as the fallback Start menu).
[main]
font=Noto Sans:size=11
icon-theme=Fluent
lines=12
width=34
line-height=30
horizontal-pad=16
vertical-pad=12
inner-pad=8
terminal=foot

[colors]
background=f3f3f3fa
text=1b1b1bff
match=0067c0ff
prompt=5a5a5aff
input=1b1b1bff
selection=e1ebf6ff
selection-text=1b1b1bff
selection-match=0067c0ff
border=dcdcdcff

[border]
width=1
radius=8
